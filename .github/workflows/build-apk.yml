name: Build APK

# Компилира подписан APK и го публикува в GitHub Releases.
# Пуска се при нов таг (напр. v1.1), при push в клон release или ръчно: Actions → Build APK → Run workflow.
on:
  push:
    tags: ["v*"]
    branches: ["ci/**", "release"]   # ci/** = само проверка; release = билд + GitHub Release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            echo "::warning::Няма секрет KEYSTORE_BASE64 — APK ще бъде подписан с временен debug ключ."
          fi

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "Molitvenik-v$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Molitvenik-apk
          path: Molitvenik-v*.apk

      - name: Publish GitHub Release
        if: ${{ !startsWith(github.ref, 'refs/heads/ci/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.VERSION) }}
          target_commitish: ${{ github.sha }}
          name: Джобен молитвеник ${{ env.VERSION }}
          files: Molitvenik-v*.apk
          body_path: RELEASE_NOTES.md
